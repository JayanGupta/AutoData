<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e21"/>
      <stop offset="50%" stop-color="#151038"/>
      <stop offset="100%" stop-color="#2a0e3f"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes grow { from { transform: scaleY(0.02); } to { transform: scaleY(1); } }
      @keyframes dot { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation-name: grow; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-direction: alternate; animation-duration: 1.6s; }
      .dot { animation: dot 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="920" cy="70" r="280" fill="url(#glow)" style="animation: pulse 4s ease-in-out infinite;"/>
  <circle cx="220" cy="330" r="220" fill="url(#glow)" opacity="0.6"/>

  <g transform="translate(100, 0)">
    <rect x="0" y="150" width="46" height="150" fill="url(#bar1)" rx="8" class="bar"/>
    <rect x="100" y="90" width="46" height="210" fill="url(#bar2)" rx="8" class="bar" style="animation-delay: 0.1s;"/>
    <rect x="200" y="210" width="46" height="90" fill="url(#bar3)" rx="8" class="bar" style="animation-delay: 0.2s;"/>
    <rect x="300" y="50" width="46" height="250" fill="url(#bar1)" rx="8" class="bar" style="animation-delay: 0.3s;"/>
    <rect x="400" y="120" width="46" height="180" fill="url(#bar2)" rx="8" class="bar" style="animation-delay: 0.15s;"/>
    <rect x="500" y="190" width="46" height="110" fill="url(#bar3)" rx="8" class="bar" style="animation-delay: 0.25s;"/>
    <rect x="600" y="70" width="46" height="230" fill="url(#bar1)" rx="8" class="bar" style="animation-delay: 0.35s;"/>
    <rect x="700" y="160" width="46" height="140" fill="url(#bar2)" rx="8" class="bar" style="animation-delay: 0.2s;"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="60" y="96" font-size="64" font-weight="700" fill="url(#text)">AutoData</text>
    <text x="62" y="142" font-size="22" fill="#cbd5e1" opacity="0.9">Your local AI data analyst - from CSV to insights in seconds</text>
  </g>

  <g transform="translate(990, 260)">
    <circle cx="0" cy="0" r="10" fill="#a78bfa" class="dot"/>
    <circle cx="40" cy="0" r="10" fill="#22d3ee" class="dot" style="animation-delay: 0.3s;"/>
    <circle cx="80" cy="0" r="10" fill="#34d399" class="dot" style="animation-delay: 0.6s;"/>
  </g>
</svg>
