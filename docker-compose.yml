services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      USER_LLM_API_KEY: ${USER_LLM_API_KEY:-}
      USER_LLM_BASE_URL: ${USER_LLM_BASE_URL:-https://api.deepseek.com/v1}
      USER_LLM_MODEL: ${USER_LLM_MODEL:-deepseek-chat}
    volumes:
      - dataset-store:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  dataset-store:
