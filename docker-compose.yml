version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend/app:/app/app:ro
      - ./sample_data:/app/sample_data:ro
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - USER_LLM_API_KEY=
      - USER_LLM_BASE_URL=https://api.deepseek.com/v1
      - USER_LLM_MODEL=deepseek-chat
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
